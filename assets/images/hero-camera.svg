<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lensOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35" />
      <stop offset="50%" stop-color="#14141c" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce2aa" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <radialGradient id="glassCoating" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0.95" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Bokeh -->
  <circle cx="160" cy="180" r="100" fill="#d4af37" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="440" cy="400" r="120" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)" />

  <!-- Outer Camera Lens Barrel -->
  <circle cx="300" cy="300" r="230" fill="url(#lensOuter)" stroke="#3a3a48" stroke-width="3" />
  
  <!-- Ribbed Focus Ring Notches -->
  <circle cx="300" cy="300" r="215" fill="none" stroke="#22222d" stroke-width="12" stroke-dasharray="4 8" />

  <!-- Gold Ring Accent (Luxury Cine Lens marker) -->
  <circle cx="300" cy="300" r="202" fill="none" stroke="url(#goldLuxury)" stroke-width="3.5" />

  <!-- Lens Element Markings -->
  <circle cx="300" cy="300" r="185" fill="#111118" stroke="#1d1d28" stroke-width="2" />
  <text x="300" y="125" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" text-anchor="middle">50mm F/1.2 &#8226; FULL-FRAME PRIME &#8226; &#216;72mm</text>
  <text x="300" y="482" fill="#d4af37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="4" text-anchor="middle">NANO COATING &#8226; PRO SERIES</text>

  <!-- Front Optical Glass Element -->
  <circle cx="300" cy="300" r="150" fill="url(#glassCoating)" stroke="#1a1a24" stroke-width="4" />

  <!-- Aperture Blades (8-blade iris) -->
  <g fill="none" stroke="url(#goldLuxury)" stroke-width="2.5" opacity="0.85">
    <path d="M300 180 L390 230" />
    <path d="M390 230 L410 320" />
    <path d="M410 320 L360 400" />
    <path d="M360 400 L270 420" />
    <path d="M270 420 L200 370" />
    <path d="M200 370 L190 280" />
    <path d="M190 280 L240 200" />
    <path d="M240 200 L300 180" />
  </g>

  <!-- Aperture Opening -->
  <polygon points="280,260 320,260 340,295 325,335 285,340 260,305" fill="#040406" stroke="url(#goldLuxury)" stroke-width="2" />

  <!-- Dynamic Glass Glare & Reflections -->
  <ellipse cx="250" cy="240" rx="65" ry="30" transform="rotate(-30 250 240)" fill="#ffffff" opacity="0.18" />
  <ellipse cx="360" cy="360" rx="35" ry="15" transform="rotate(-30 360 360)" fill="#38bdf8" opacity="0.25" />
  <circle cx="330" cy="270" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Floating Badge: Shutter Speed / Aperture Specs -->
  <g transform="translate(60, 240)">
    <rect width="145" height="52" rx="12" fill="#14141c" stroke="url(#goldLuxury)" stroke-width="1.5" />
    <text x="20" y="24" fill="#fce2aa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">f/1.2 &#8226; 1/8000s</text>
    <text x="20" y="40" fill="#a1a1aa" font-family="sans-serif" font-size="10">Ultra Sharp Bokeh</text>
  </g>

  <!-- Floating Badge: ISO & Sensor -->
  <g transform="translate(400, 360)">
    <rect width="145" height="52" rx="12" fill="#14141c" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">ISO 100 &#8226; 61 MP</text>
    <text x="20" y="40" fill="#a1a1aa" font-family="sans-serif" font-size="10">High Dynamic Range</text>
  </g>
</svg>
