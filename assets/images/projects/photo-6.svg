<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#12121c" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <radialGradient id="causticGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#commBg)" />
  <circle cx="400" cy="300" r="260" fill="url(#causticGlow)" />

  <!-- Pedestal / Slate Rock Surface with Reflections -->
  <polygon points="180,440 620,440 560,510 240,510" fill="#181822" stroke="#2a2a3c" stroke-width="2" />
  
  <!-- Water Drops & Splash Caustics on Slate -->
  <ellipse cx="280" cy="460" rx="14" ry="6" fill="#38bdf8" opacity="0.4" />
  <ellipse cx="500" cy="470" rx="20" ry="7" fill="#38bdf8" opacity="0.3" />
  <ellipse cx="360" cy="485" rx="8" ry="4" fill="#ffffff" opacity="0.6" />

  <!-- Luxury Chronograph Watch Showcase -->
  <!-- Leather Strap Top & Bottom -->
  <rect x="365" y="120" width="70" height="110" rx="6" fill="#2d1b18" stroke="#4a2820" stroke-width="1.5" />
  <rect x="365" y="370" width="70" height="110" rx="6" fill="#2d1b18" stroke="#4a2820" stroke-width="1.5" />

  <!-- Watch Bezel (Rose Gold) -->
  <circle cx="400" cy="300" r="105" fill="#1c1924" stroke="url(#roseGold)" stroke-width="6" />
  <circle cx="400" cy="300" r="95" fill="#0d0d14" stroke="#333344" stroke-width="1.5" />

  <!-- Dial Markers -->
  <circle cx="400" cy="300" r="3" fill="#ffffff" />
  <line x1="400" y1="215" x2="400" y2="230" stroke="url(#roseGold)" stroke-width="3" />
  <line x1="400" y1="370" x2="400" y2="385" stroke="url(#roseGold)" stroke-width="3" />
  <line x1="315" y1="300" x2="330" y2="300" stroke="url(#roseGold)" stroke-width="3" />
  <line x1="470" y1="300" x2="485" y2="300" stroke="url(#roseGold)" stroke-width="3" />

  <!-- Sub-dials -->
  <circle cx="365" cy="300" r="18" fill="#14141e" stroke="url(#roseGold)" stroke-width="1" />
  <circle cx="435" cy="300" r="18" fill="#14141e" stroke="url(#roseGold)" stroke-width="1" />
  <circle cx="400" cy="340" r="18" fill="#14141e" stroke="url(#roseGold)" stroke-width="1" />

  <!-- Watch Hands (10:10 classic commercial presentation) -->
  <line x1="400" y1="300" x2="355" y2="260" stroke="#fbcfe8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="400" y1="300" x2="450" y2="255" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="300" x2="400" y2="235" stroke="#38bdf8" stroke-width="1" />

  <!-- Glass Light Slash Reflection -->
  <path d="M330 240 Q400 300 470 360" stroke="#ffffff" stroke-width="3" opacity="0.3" stroke-linecap="round" />

  </svg>
